packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@reown/appkit': true
  bufferutil: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  utf-8-validate: true

catalog:
  '@apollo/client': '4.2.12'

peerDependencyRules:
  allowedVersions:
    '@types/react': ^19.0.0
    '@types/react-dom': ^19.0.0
    react: ^19.0.0
    react-dom: ^19.0.0

overrides:
  '@types/react': '19.2'
  '@types/react-dom': '19.2'
  # @reown/appkit-wallet pins zod@3.22.4 (no v4/ subpath), but @hookform/resolvers
  # imports zod/v4/core as a phantom dep. Force 3.25.76 so both resolve correctly.
  'zod': '3.25.76'

publicHoistPattern:
  - '*graphql*' # https://github.com/vercel/next.js/issues/68805
  - '@reown/*' # Fix for @reown/appkit resolution in Next + pnpm

minimumReleaseAgeExclude:
  - '@balancer/sdk@6.1.1'
