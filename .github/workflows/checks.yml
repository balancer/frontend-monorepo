name: Checks

on:
  pull_request:
    types: [opened, synchronize]

env:
  NEXT_PUBLIC_BALANCER_API_URL: https://test-api-v3.balancer.fi/graphql
  NEXT_PUBLIC_WALLET_CONNECT_ID: ${{ secrets.NEXT_PUBLIC_WALLET_CONNECT_ID }}
  NEXT_PRIVATE_ALCHEMY_KEY: ${{ secrets.PRIVATE_ALCHEMY_KEY }}
  NEXT_PRIVATE_DRPC_KEY: ${{ secrets.PRIVATE_DRPC_KEY }}
  TEST_ACCOUNT_MNEMONIC: ${{ secrets.TEST_ACCOUNT_MNEMONIC }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  SLACK_BOT_TOKEN: ${{secrets.SLACK_BOT_TOKEN}}

jobs:
  # Skip this job as it is already part of the E2E-Smoke-Test job
  # Build:
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@v5
  #     - name: Setup
  #       uses: ./.github/actions/setup
  #     - name: Run build
  #       env:
  #         NODE_OPTIONS: "--max_old_space_size=4096"
  #       run: pnpm run build

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint
      - name: Run prettier
        run: pnpm prettier
      - name: Run stylelint
        run: pnpm stylelint

  Unit-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run typecheck
        env:
          NODE_OPTIONS: "--max_old_space_size=6144"
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      #  Uncomment to debug turborepo summary when running with --summarize option
      #  Context: https://turbo.build/repo/docs/crafting-your-repository/caching#using-run-summaries
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: unit-turbo-summary
      #     path: |
      #       ./.turbo/runs/
      #     retention-days: 30

  Integration-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        # with:
        #   cache: false # Disable cache after foundry-toolchain upgrade
      - name: Run integration tests
        run: pnpm test:integration

  E2E-Smoke-Test-Balancer:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      NEXT_PUBLIC_PROJECT_ID: balancer
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Playwright smoke tests (Balancer)
        run: pnpm test:e2e:build:bal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report-bal
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30

  E2E-Smoke-Test-Beets:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      NEXT_PUBLIC_PROJECT_ID: beets
      NEXT_PUBLIC_BALANCER_API_URL: https://backend-v3.beets-ftm-node.com/
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Playwright smoke tests (Beets)
        run: pnpm test:e2e:build:beets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report-beets
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30

  E2E-Smoke-Test-Analytics:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Run Playwright smoke tests (Analytics)
        run: pnpm test:e2e:build:analytics
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report-analytics
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30

  # Resolve the fork blocks once per run so all four dev forks (3 Balancer shards
  # + Beets) share one block, and the block is floored to a bucket so runs within
  # the same window fork at the identical block and hit drpc's warm state cache
  # instead of re-reading the trie at a fresh head every run. Max staleness =
  # depth + bucket: ~8h mainnet, ~6h sonic — recent enough to match the test API
  # indexer (a pinned block drifted stale for weeks: PR #2811/#2812).
  Resolve-Fork-Blocks:
    runs-on: ubuntu-latest
    outputs:
      mainnet: ${{ steps.mainnet.outputs.block }}
      sonic: ${{ steps.sonic.outputs.block }}
    env:
      # Reorg-safety depth and bucket size, per chain (mainnet ~12s blocks,
      # sonic ~1s blocks).
      MAINNET_MIN_DEPTH: 500
      MAINNET_BUCKET: 2000
      SONIC_MIN_DEPTH: 1000
      SONIC_BUCKET: 20000
    steps:
      - name: Set up foundry (includes cast)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: Resolve mainnet fork block
        id: mainnet
        run: |
          LATEST=$(cast block-number --rpc-url "https://lb.drpc.live/ethereum/${{ env.NEXT_PRIVATE_DRPC_KEY }}")
          BLOCK=$(( (LATEST - MAINNET_MIN_DEPTH) / MAINNET_BUCKET * MAINNET_BUCKET ))
          echo "Forking mainnet at block $BLOCK (latest: $LATEST)"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"
      - name: Resolve sonic fork block
        id: sonic
        run: |
          LATEST=$(cast block-number --rpc-url "https://lb.drpc.live/sonic/${{ env.NEXT_PRIVATE_DRPC_KEY }}")
          BLOCK=$(( (LATEST - SONIC_MIN_DEPTH) / SONIC_BUCKET * SONIC_BUCKET ))
          echo "Forking sonic at block $BLOCK (latest: $LATEST)"
          echo "block=$BLOCK" >> "$GITHUB_OUTPUT"

  E2E-Dev-Test-Balancer:
    needs: Resolve-Fork-Blocks
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    strategy:
      fail-fast: false
      matrix:
        # tests/dev/balancer is split by whole spec files (see
        # packages/e2e-tests/scripts/shard-specs.mjs), so adding a spec no longer
        # means rebalancing hardcoded file lists. `id` only names artifacts —
        # shard values contain a slash.
        include:
          - id: 1
            shard: 1/3
          - id: 2
            shard: 2/3
          - id: 3
            shard: 3/3
    env:
      NEXT_PUBLIC_PROJECT_ID: balancer
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      E2E_SHARD: ${{ matrix.shard }}
      E2E_FORK_BLOCK_NUMBER: ${{ needs.Resolve-Fork-Blocks.outputs.mainnet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: Start anvil fork in mainnet
        run: anvil --mnemonic "${{ env.TEST_ACCOUNT_MNEMONIC }}" --fork-url "https://lb.drpc.live/ethereum/${{ env.NEXT_PRIVATE_DRPC_KEY }}" --fork-block-number ${{ env.E2E_FORK_BLOCK_NUMBER }} --fork-retry-backoff 1000 --no-rate-limit --port 8545 &
      - name: Run Playwright dev tests (Balancer shard ${{ matrix.shard }})
        run: pnpm test:e2e:dev:bal
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-dev-report-bal-${{ matrix.id }}
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30

  E2E-Dev-Test-Beets:
    needs: Resolve-Fork-Blocks
    timeout-minutes: 25
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      NEXT_PUBLIC_PROJECT_ID: beets
      NEXT_PUBLIC_BALANCER_API_URL: https://backend-v3.beets-ftm-node.com/
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      E2E_FORK_BLOCK_NUMBER: ${{ needs.Resolve-Fork-Blocks.outputs.sonic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup
        uses: ./.github/actions/setup
      - name: Set up foundry (includes anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
      - name: Start anvil fork in sonic
        run: anvil --mnemonic "${{ env.TEST_ACCOUNT_MNEMONIC }}" --fork-url "https://lb.drpc.live/sonic/${{ env.NEXT_PRIVATE_DRPC_KEY }}" --fork-block-number ${{ env.E2E_FORK_BLOCK_NUMBER }} --fork-retry-backoff 1000 --no-rate-limit --port 8545 &
      - name: Run Playwright dev tests (Beets)
        run: pnpm test:e2e:dev:beets
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-dev-report-beets
          path: |
            ./packages/e2e-tests/playwright-report/
            ./packages/e2e-tests/test-results/
          retention-days: 30
